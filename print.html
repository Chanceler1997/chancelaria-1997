<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documento · Chancelaria 1997</title>
<style>
:root{--azul:#152541;--ouro:#c9a84c;--texto:#111;--cinza:#555}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e9e9;color:var(--texto);font-family:Arial,"Segoe UI",sans-serif}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;padding:12px;background:var(--azul);box-shadow:0 3px 12px rgba(0,0,0,.25)}
.toolbar button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--ouro);color:var(--azul)}.secondary{background:#fff;color:var(--azul)}
.page{width:210mm;min-height:297mm;margin:14px auto;background:#fff;padding:30mm 20mm 20mm 30mm;box-shadow:0 4px 22px rgba(0,0,0,.18)}
.official-header{margin:0 0 9mm;border:1px solid rgba(201,168,76,.75);border-radius:4mm;overflow:hidden;background:#fff;break-inside:avoid;page-break-inside:avoid}
.official-header img{display:block;width:100%;height:auto}
h2{font-size:14pt;margin:0 0 8mm;text-align:center;text-transform:uppercase;color:var(--azul);break-after:avoid-page;page-break-after:avoid;line-height:1.25}
p{font-size:12pt;line-height:1.5;margin:0 0 4mm;text-align:justify;orphans:3;widows:3}
table{width:100%;border-collapse:collapse;font-size:9pt;line-height:1.25;margin-top:4mm;table-layout:fixed}thead{display:table-header-group}tfoot{display:table-footer-group}tr{break-inside:avoid;page-break-inside:avoid}th,td{border:1px solid #aaa;padding:1.8mm;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:normal}th{background:#ece8df;color:var(--azul);font-weight:800}
.collective-table th:nth-child(1){width:23%}.collective-table th:nth-child(2){width:16%}.collective-table th:nth-child(3){width:9%}.collective-table th:nth-child(4){width:15%}.collective-table th:nth-child(5){width:17%}.collective-table th:nth-child(6){width:12%}.collective-table th:nth-child(7){width:8%}
.individual-table th:nth-child(1){width:23%}.individual-table th:nth-child(2){width:25%}.individual-table th:nth-child(3){width:24%}.individual-table th:nth-child(4){width:28%}
.session-report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5mm;margin:4mm 0}.session-report-box{border:1px solid #b8b0a2;border-radius:2mm;padding:2.5mm;text-align:center;background:#faf8f3}.session-report-box b{display:block;font-size:13pt;color:var(--azul)}.session-report-box span{display:block;font-size:7.5pt;margin-top:1mm;text-transform:uppercase;font-weight:800;color:#5d574e}.session-attendance-table th:nth-child(1){width:7%}.session-attendance-table th:nth-child(2){width:35%}.session-attendance-table th:nth-child(3){width:16%}.session-attendance-table th:nth-child(4){width:14%}.session-attendance-table th:nth-child(5){width:28%}
.assinatura{margin-top:13mm;text-align:center;font-size:10pt;break-inside:avoid;page-break-inside:avoid}.assinatura.dual-signature{display:grid;grid-template-columns:1fr 1fr;gap:16mm;align-items:end}.signature-person{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:36mm}.signature-image{display:block;width:72mm;max-width:96%;height:auto;max-height:25mm;object-fit:contain;margin:0 auto -1mm}.signature-role{font-weight:700;font-size:10pt;color:var(--azul);line-height:1.25}.signature-lodge{font-size:8pt;color:var(--cinza);margin-top:1mm}.signature-line{width:100%;max-width:72mm;border-top:.35mm solid #333;margin:24mm auto 2mm}
.footer{position:static;margin-top:8mm;border-top:.25mm solid #999;padding-top:2mm;font-size:8pt;line-height:1.25;text-align:justify;color:#333;break-inside:avoid;page-break-inside:avoid}
.certificate{font-family:Arial,"Segoe UI",sans-serif}.certificate h2{font-size:14pt;letter-spacing:.15px;margin:0 0 12mm}.certificate .certificate-body{font-size:12pt;line-height:1.5;text-align:justify;text-indent:12.5mm;margin:0}.certificate .certificate-date{font-size:12pt;line-height:1.5;text-align:right;text-indent:0;margin-top:12mm}.certificate-document .assinatura{margin-top:13mm}.certificate-document .footer{margin-top:12mm}.certificate-document .official-header{margin-bottom:12mm}
.error{max-width:680px;margin:30px auto;background:#fff;padding:24px;border-radius:12px;border:1px solid #b13b33}
@page{size:A4 portrait;margin:0}
@media(max-width:800px){.page{width:100%;min-height:0;margin:0;box-shadow:none;padding:24px 18px 90px}.footer{margin-top:28px}.toolbar{position:relative}}
@media print{
  html,body{background:#fff;width:100%}.toolbar{display:none!important}.page{width:210mm;min-height:297mm;margin:0;box-shadow:none;padding:30mm 20mm 20mm 30mm}.official-header{margin-bottom:8mm}h2{font-size:14pt}.certificate h2{margin-bottom:12mm}p{font-size:12pt;line-height:1.5}table{font-size:8.6pt;margin-top:3mm}th,td{padding:1.6mm}.assinatura{margin-top:10mm}.footer{margin-top:5mm}
}
</style>
</head>
<body>
<div class="toolbar"><button class="primary" onclick="window.print()">Imprimir ou salvar em PDF</button><button class="secondary" onclick="voltarAoAplicativo()">Fechar e voltar</button></div>
<main id="app"></main>
<script>
(function(){
  const app=document.getElementById('app');
  function decodeBase64UrlUtf8(raw){raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';const bin=atob(raw),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
  window.voltarAoAplicativo=function(){try{window.close()}catch(e){}setTimeout(()=>{if(history.length>1)history.back()},120)};
  const assinaturaPadrao='<div class="signature-person signature-chanceler"><img class="signature-image" src="assinatura-chanceler.png" alt="Assinatura do Chanceler"><div class="signature-role">Chanceler</div><div class="signature-lodge">A∴R∴L∴S∴ Razão e Força nº 1997</div></div>';
  try{
    const raw=location.hash.slice(1);if(!raw)throw new Error('Documento não recebido.');
    const data=JSON.parse(decodeBase64UrlUtf8(raw));history.replaceState(null,'',location.pathname+location.search);document.title=(data.titulo||'Documento')+' · Chancelaria 1997';
    const assinatura=data.assinatura||assinaturaPadrao;const rodape=data.rodape||'Art. 76 do Regulamento Geral da Federação: o Maçom ativo terá seus direitos suspensos quando deixar de frequentar sem justa causa 50% das sessões da Loja no período de doze meses.';const documentClass=String(data.documentClass||'').replace(/[^a-z0-9_-]/gi,'');
    app.innerHTML=`<article class="page ${documentClass}"><header class="official-header"><img src="cabecalho-oficial.jpg" alt="Cabeçalho oficial da A.R.L.S. Razão e Força nº 1997"></header>${data.corpo||''}<div class="assinatura${data.assinaturaClasse?' '+data.assinaturaClasse:''}">${assinatura}</div><div class="footer">${rodape}</div></article>`;
    const deveImprimir=new URLSearchParams(location.search).get('print')==='1';if(deveImprimir){const imgs=[...app.querySelectorAll('img')];const aguardar=Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true})})));aguardar.then(()=>setTimeout(()=>{try{window.print()}catch(e){}},500))}
  }catch(e){app.innerHTML=`<div class="error"><h2>Não foi possível abrir o documento</h2><p>${String(e.message||e)}</p><p>Volte ao aplicativo e gere o documento novamente.</p></div>`}
})();
</script>
</body>
</html>
