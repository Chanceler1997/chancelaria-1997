<style>
:root{--azul:#152541;--ouro:#c9a84c;--texto:#111;--cinza:#555}

.collective-table th:nth-child(1){width:23%}.collective-table th:nth-child(2){width:16%}.collective-table th:nth-child(3){width:9%}.collective-table th:nth-child(4){width:15%}.collective-table th:nth-child(5){width:17%}.collective-table th:nth-child(6){width:12%}.collective-table th:nth-child(7){width:8%}
.individual-table th:nth-child(1){width:23%}.individual-table th:nth-child(2){width:25%}.individual-table th:nth-child(3){width:24%}.individual-table th:nth-child(4){width:28%}

.certificate-document{position:relative;padding:15mm 16mm 18mm!important;outline:1px solid rgba(201,168,76,.78);outline-offset:-7mm}.certificate-document:before{content:"";position:absolute;inset:9mm;border:1px solid rgba(21,37,65,.45);pointer-events:none}.certificate-document .official-header{margin:0 0 10mm;border:0;border-radius:0;border-bottom:1.2px solid #c9a84c;padding-bottom:4mm}.certificate{font-family:Georgia,"Times New Roman",serif;color:#171717;padding:0 5mm}.certificate h2{font-family:Georgia,"Times New Roman",serif;font-size:16pt;letter-spacing:1.1px;margin:0 0 3mm;color:#152541}.certificate .certificate-subtitle{text-align:center;font-size:8.5pt;letter-spacing:1.6px;text-transform:uppercase;color:#8a6b20;margin-bottom:7mm}.certificate .certificate-rule{width:54mm;height:3px;border-top:1px solid #c9a84c;border-bottom:1px solid #152541;margin:0 auto 10mm}.certificate .certificate-number{text-align:center;font-family:Arial,"Segoe UI",sans-serif;font-size:8.5pt;color:#666;margin:0 0 5mm}.certificate .certificate-body{font-size:12pt;line-height:1.65;text-align:justify;text-indent:12.5mm;margin:0}.certificate .certificate-date{font-size:11.5pt;line-height:1.5;text-align:right;text-indent:0;margin-top:13mm}.certificate-document .assinatura{margin-top:12mm}.certificate-document .signature-image{width:68mm;max-height:22mm}.certificate-document .signature-role{font-family:Georgia,"Times New Roman",serif}.certificate-document .signature-lodge{font-family:Georgia,"Times New Roman",serif}.certificate-document .footer{font-family:Georgia,"Times New Roman",serif;text-align:center;margin-top:10mm;border-top:.25mm solid rgba(201,168,76,.65);color:#666}.certificate-document .official-header{margin-bottom:10mm}

@page{size:A4 portrait;margin:0}

}

@media print{.page.certificate-art-v584{width:210mm!important;height:297mm!important;min-height:297mm!important;padding:0!important}.cert-art{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<div class="toolbar"><button class="primary" onclick="window.print()">Imprimir ou salvar em PDF</button><button class="secondary" onclick="voltarAoAplicativo()">Fechar e voltar</button></div>
<main id="app"></main>
<script>
(function(){
  const app=document.getElementById('app');
  function decodeBase64UrlUtf8(raw){raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';const bin=atob(raw),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
  window.voltarAoAplicativo=function(){try{window.close()}catch(e){}setTimeout(()=>{if(history.length>1)history.back()},120)};
  const assinaturaPadrao='<div class="signature-person signature-chanceler"><img class="signature-image" src="assinatura-chanceler.png" alt="Assinatura do Chanceler"><div class="signature-role">Chanceler</div><div class="signature-lodge">A∴R∴L∴S∴ Razão e Força nº 1997</div></div>';
  try{
    const raw=location.hash.slice(1);if(!raw)throw new Error('Documento não recebido.');
    const data=JSON.parse(decodeBase64UrlUtf8(raw));history.replaceState(null,'',location.pathname+location.search);document.title=(data.titulo||'Documento')+' · Chancelaria 1997';
    const assinatura=data.assinatura||assinaturaPadrao;const rodape=data.rodape||'Art. 76 do Regulamento Geral da Federação: o Maçom ativo terá seus direitos suspensos quando deixar de frequentar sem justa causa 50% das sessões da Loja no período de doze meses.';const documentClass=String(data.documentClass||'').replace(/[^a-z0-9_-]/gi,'');
    if(documentClass==='certificate-art-v584'&&data.certificado){
      const c=data.certificado, esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      app.innerHTML=`<article class="page certificate-art-v584"><div class="cert-art"><div class="dyn title"><div>ATESTADO DE</div><div>FREQUÊNCIA MAÇÔNICA</div></div><div class="rule"></div><div class="dyn intro">Atestamos, para os fins maçônicos cabíveis, que o Irmão</div><div class="dyn name">${esc(c.nome)}</div><div class="dyn cim">${c.cim?'CIM '+esc(c.cim)+(c.grau?' · ':''):''}${esc(c.grau)}</div><div class="dyn loja">pertencente à ${esc(c.loja)}${c.numeroLoja?' nº '+esc(c.numeroLoja):''},</div><div class="dyn oriente">Oriente de ${esc(c.oriente)}, esteve presente aos trabalhos da</div><div class="dyn host">A∴R∴L∴S∴ Razão e Força nº 1997</div><div class="dyn date-session">em ${esc(c.dataSessao)}, na</div><div class="dyn session">${esc(c.tipoSessao)}</div><div class="dyn emit">Porto Murtinho/MS, ${esc(c.dataEmissao)}.</div><img class="signature" src="assinatura-chanceler.png" alt="Assinatura do Chanceler"><div class="dyn role">Chanceler</div><div class="dyn lodge">A∴R∴L∴S∴ Razão e Força nº 1997</div><div class="dyn jur">Federada ao GOB · Jurisdicionada ao GOB-MS</div><div class="dyn number">Atestado nº ${esc(c.numeroAtestado)}</div></div></article>`;
    }else{
      app.innerHTML=`<article class="page ${documentClass}"><header class="official-header"><img src="cabecalho-oficial.jpg" alt="Cabeçalho oficial da A.R.L.S. Razão e Força nº 1997"></header><div class="jurisdiction-line">Jurisdicionada ao GOB-MS</div>${data.corpo||''}<div class="assinatura${data.assinaturaClasse?' '+data.assinaturaClasse:''}">${assinatura}</div><div class="footer">${rodape}</div></article>`;
    }
    const deveImprimir=new URLSearchParams(location.search).get('print')==='1';if(deveImprimir){const imgs=[...app.querySelectorAll('img')];const aguardar=Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true})})));aguardar.then(()=>setTimeout(()=>{try{window.print()}catch(e){}},500))}
  }catch(e){app.innerHTML=`<div class="error"><h2>Não foi possível abrir o documento</h2><p>${String(e.message||e)}</p><p>Volte ao aplicativo e gere o documento novamente.</p></div>`}
})();
</script>
